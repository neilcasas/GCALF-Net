name: gcalf
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu113
      - torch==1.10.1+cu113
      - torchvision==0.11.2+cu113
      - torchaudio==0.10.1+cu113
      - -r requirements.txt
      - -r requirements-tools.txt
      - -e .
