# @package __global__
defaults:
  - gcalf_full

# Final grade configuration: CORAL and lesion transfer are one declared
# intervention. Their contributions are intentionally not identified
# separately by the study design (docs/adr/0005-final-grade-configuration.md).
trainer_cfg:
  grade_class_weight_source: "anchor"
  # Filled from the <=250-batch Phase 1 post-paste telemetry before launch.
  # Keeping this null makes an accidental unmeasured launch fail at fit start.
  grade_anchor_class_counts: null

augment_cfg:
  dataloader: "DataLoader{}DLesionTransfer"
  dataloader_kwargs:
    grade_balanced_sampling: false
    lesion_transfer_cfg:
      enabled: true
      bank_dir: ${oc.env:GCALF_LESION_BANK_DIR, null}
      source_grades: [4, 5]
      p_paste: 0.5
      max_pastes_per_patch: 1
      region_mode: dilated
      dilation_vox: 3
      feather_sigma: 1.0
      zone_match: prefer
      instance_id_offset: 10000
      jitter_channels: [0, 2]
      shuffle_labels: false
      spatial:
        p_rot: 0.5
        rot_range_deg: 30
        p_scale: 0.5
        scale_range: [0.8, 1.2]
        p_flip: 0.5
        flip_axes: [2]
      intensity:
        p_gamma: 0.3
        gamma_range: [0.8, 1.25]
        p_blur: 0.2

model_cfg:
  head_grade_kwargs:
    grade_loss_type: coral
