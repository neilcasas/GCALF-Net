# @package __global__
defaults:
  - v001

trainer_cfg:
  # ``model_best`` remains the detection-mAP checkpoint. Grade evaluation uses
  # the deterministic state after the declared SWA pass, not an argmax over a
  # near-chance patch-level monitor (ADR 0003 Sec 2).
  grade_checkpoint: "post_swa"
  grade_monitor_key: "val_grade_balanced_accuracy"
  grade_monitor_mode: "max"
  # Keep lesion weights until Stage 2 records sampled-anchor counts. Anchor
  # weights must be supplied as four committed counts, never inferred here.
  grade_class_weight_source: "lesion"
  # Protocol lock (ADR 0003 Sec 5 / Sec 5a): grade-head freezing is DISABLED for
  # the five-fold matrix.  Declared explicitly rather than left absent so the
  # decision is recorded in the configuration the runs resolve from.
  grade_freeze_patience: null

augment_cfg:
  dataloader_kwargs:
    # Stage 3 enables this only for its fresh, gated remediation pilot.
    grade_balanced_sampling: false

model_cfg:
  encoder_kwargs:
    gcalf_cfg:
      frequency_filter_type: fdsf
      fusion_type: waf
      num_levels: 5
      fusion_levels: [0, 1, 2, 3, 4]
      fdsf:
        radius: 0.15
      waf:
        window_size: [2, 7, 7]
        num_heads: 4
  head_grade_kwargs:
    num_convs: 1
    norm_channels_per_group: 16
    norm_affine: true
