# @package __global__
defaults:
  - v001

trainer_cfg:
  # Detection and grading peak at different epochs.  Keep both selections;
  # ``model_best`` remains the detection-mAP checkpoint and this creates
  # ``model_best_grade`` from patch-level lesion-matched macro recall.
  grade_monitor_key: "val_grade_balanced_accuracy"
  grade_monitor_mode: "max"
  # Protocol lock (ADR 0003 Sec 5 / Sec 5a): grade-head freezing is DISABLED for
  # the five-fold matrix.  Declared explicitly rather than left absent so the
  # decision is recorded in the configuration the runs resolve from.
  grade_freeze_patience: null

model_cfg:
  encoder_kwargs:
    gcalf_cfg:
      frequency_filter_type: fdsf
      fusion_type: waf
      num_levels: 5
      fusion_levels: [0, 1, 2, 3, 4]
      fdsf:
        radius: 0.15
      waf:
        window_size: [2, 7, 7]
        num_heads: 4
  head_grade_kwargs:
    num_convs: 1
    norm_channels_per_group: 16
    norm_affine: true
