default:
  image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-devel

stages:
  - build

build-job:
  stage: build
  script:
    - echo "Check Versions"
    - python --version
    - python -c "import torch"
    - pip --version
    - pip uninstall torchtext -y
    - echo "Install Package"
    - pip install .
    - pip install pytest
    - echo "Batchgen Master"
    - pip uninstall batchgenerators -y
    - pip install git+https://github.com/MIC-DKFZ/batchgenerators.git
    - echo "Run Tests"
    - coverage run -m pytest -v
    - coverage report
    - coverage xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml 
  coverage: '/TOTAL.*\s+(\d+\%)/'
